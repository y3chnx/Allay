<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width,initial-scale=1' />
  <title>Allay Motifs</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0d;
      --bg-alt: #11161a;
      --panel: rgba(18, 22, 26, 0.95);
      --panel-strong: rgba(12, 16, 18, 0.96);
      --panel-soft: rgba(26, 31, 34, 0.92);
      --line: rgba(167, 219, 142, 0.28);
      --line-soft: rgba(255, 255, 255, 0.08);
      --brand: #aeff63;
      --brand-strong: #96f346;
      --brand-deep: #5ea93a;
      --ink: #f4f5ef;
      --muted: #b4b9b0;
      --muted-strong: #d8dbd3;
      --slate: #6e7d6f;
      --shadow: rgba(0, 0, 0, 0.54);
      --danger: #ff5d5d;
      --success: #6ce781;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Segoe UI', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 38px 18px 40px;
      background:
        radial-gradient(circle at top left, rgba(17, 26, 18, 0.9), transparent 32%),
        radial-gradient(circle at bottom right, rgba(27, 34, 18, 0.35), transparent 24%),
        var(--bg);
    }

    .topbar {
      position: fixed;
      top: 18px;
      left: 22px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 8px 8px;
      border: 1px solid rgba(174, 255, 99, 0.2);
      background: rgba(10, 12, 14, 0.76);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }

    .brand-mark {
      width: 110px;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(174, 255, 99, 0.12);
      background: rgba(255, 255, 255, 0.02);
      object-fit: contain;
    }

    .brand-name {
      display: none;
    }

    .page-header {
      position: relative;
      width: min(1040px, 100%);
      margin: 0 auto 22px;
      text-align: center;
      padding-top: 18px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.06em;
      font-weight: 800;
      color: var(--ink);
    }

    .page-header .subtitle {
      margin: 10px auto 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .page-body {
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    .card {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.95fr);
      gap: 22px;
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(14, 18, 21, 0.98), rgba(11, 14, 16, 0.96));
      border: 1px solid var(--line);
      box-shadow: 0 18px 44px rgba(0,0,0,0.48);
    }

    .controls {
      display: grid;
      gap: 14px;
      padding-right: 10px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
      color: var(--brand);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      padding: 6px 10px;
      border-radius: 9px;
      border: 1px solid var(--line-soft);
      background: rgba(114, 125, 117, 0.08);
      color: var(--muted-strong);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 10px 10px 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .control-row:last-of-type {
      border-bottom: none;
    }

    .control-row label {
      font-weight: 700;
      color: var(--muted-strong);
      font-size: 0.99rem;
    }

    .control-row .control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(88px, 110px);
      gap: 12px;
      align-items: center;
    }

    .control input[type='range'] {
      width: 100%;
      accent-color: var(--brand);
      cursor: pointer;
    }

    .control select,
    .control input[type='number'] {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(11, 15, 17, 0.9);
      color: var(--ink);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.98rem;
      font-weight: 700;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .control select:focus,
    .control input[type='number']:focus,
    .action-btn:focus-visible,
    .transport button:focus-visible {
      outline: none;
      border-color: rgba(174, 255, 99, 0.8);
      box-shadow: 0 0 0 3px rgba(174, 255, 99, 0.12);
    }

    .badge {
      display: inline-flex;
      min-width: 52px;
      padding: 10px 12px;
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      color: var(--ink);
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .controls-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 10px;
    }

    .action-btn,
    .transport button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 0.94rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .action-btn:hover,
    .transport button:hover {
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: linear-gradient(180deg, var(--brand), var(--brand-strong));
      color: #121712;
      box-shadow: 0 9px 24px rgba(174,255,99,0.18);
    }

    .action-btn.secondary {
      background: rgba(16, 20, 21, 0.8);
      color: var(--ink);
      border-color: rgba(255,255,255,0.08);
    }

    .current-selection {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.04);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .output-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(10,15,16,0.92), rgba(12,15,16,0.98));
      border: 1px solid rgba(255,255,255,0.06);
      min-height: 500px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      font-size: 0.78rem;
      line-height: 1.3;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-row strong {
      color: var(--brand);
      font-weight: 800;
    }

    .status-row #statusMessage {
      color: var(--muted-strong);
      letter-spacing: 0.02em;
      text-transform: none;
      text-align: right;
      font-weight: 600;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-cell {
      padding: 12px 10px 10px;
      border-radius: 12px;
      background: rgba(17, 21, 23, 0.9);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 70px;
    }

    .summary-cell .label {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .summary-cell strong {
      font-size: 1rem;
      color: var(--ink);
      line-height: 1.2;
      font-weight: 800;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 6px;
      color: var(--muted-strong);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.76rem;
    }

    .transport {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .transport button {
      min-width: 86px;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .transport .play {
      background: rgba(154, 242, 91, 0.12);
      color: var(--brand);
      border-color: rgba(154,242,91,0.2);
    }

    .transport .stop {
      background: rgba(255,255,255,0.02);
      color: var(--ink);
      border-color: rgba(255,255,255,0.08);
    }

    .output-area {
      position: relative;
      flex: 1;
      min-height: 290px;
      padding: 14px;
      display: flex;
      align-items: stretch;
      background: rgba(11, 12, 15, 0.92);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .empty-state {
      width: 100%;
      display: grid;
      place-items: center;
      background: rgba(15, 18, 20, 0.8);
      border: 1px dashed rgba(174,255,99,0.18);
      border-radius: 14px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      color: var(--ink);
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .empty-state p {
      margin: 0;
      max-width: 300px;
      line-height: 1.5;
    }

    .motif-shell {
      display: flex;
      width: 100%;
      min-height: 260px;
      gap: 10px;
    }

    .pitch-labels {
      width: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 0 12px;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 700;
    }

    .pitch-labels span {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 20px;
    }

    .piano-roll {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 100%;
      min-height: 260px;
      border-radius: 12px;
      background:
        linear-gradient(to right, rgba(174,255,99,0.08), rgba(174,255,99,0.01)),
        repeating-linear-gradient(
          to right,
          rgba(255,255,255,0.06),
          rgba(255,255,255,0.06) 1px,
          transparent 1px,
          transparent calc(100% / 16)
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.05),
          rgba(255,255,255,0.05) 1px,
          transparent 1px,
          transparent 24px
        );
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .note-block {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      min-width: 12px;
      background: linear-gradient(135deg, rgba(174,255,99,0.9), rgba(122, 219, 70, 0.92));
      border: 1px solid rgba(10, 16, 13, 0.38);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 7px 18px rgba(174,255,99,0.14);
      color: rgba(8, 11, 9, 0.9);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      overflow: hidden;
      white-space: nowrap;
      padding: 0 4px;
    }

    @media (max-width: 820px) {
      body {
        padding-top: 88px;
      }

      .topbar {
        left: 14px;
        top: 14px;
      }

      .card {
        grid-template-columns: 1fr;
      }

      .control-row {
        grid-template-columns: 1fr;
      }

      .control-row .control {
        grid-template-columns: minmax(0, 1fr) 86px;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 480px) {
      .page-header {
        padding-top: 12px;
      }

      .card {
        padding: 16px;
      }

      .controls-footer {
        flex-direction: column;
      }

      .action-btn,
      .transport button {
        width: 100%;
      }

      .status-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .status-row #statusMessage {
        text-align: left;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class='topbar' aria-label='Allamein Studios brand mark'>
    <img class='brand-mark' src='https://i.imgur.com/HvQ6wZ6.png' alt='Allamein Studios logo' />
  </div>

  <header class='page-header'>
    <p class='eyebrow'>Allamein music tutor</p>
    <h1>Allay Motifs</h1>
    <p class='subtitle'>Generate a short tonal phrase, inspect its contour, and audition the motif at a controlled tempo.</p>
  </header>

  <main class='page-body' role='main'>
    <section class='card' aria-label='Allay Motifs generator and preview panel'>
      <div class='controls' aria-label='generator controls'>
        <div class='panel-header'>
          <h2>Controls</h2>
          <div class='tag'>Live</div>
        </div>

        <div class='control-row'>
          <label for='bpmRange'>BPM</label>
          <div class='control'>
            <input id='bpmRange' type='range' min='30' max='220' value='120' aria-label='BPM range' />
            <input id='bpmNumber' type='number' min='30' max='220' step='1' value='120' aria-label='BPM number' />
          </div>
        </div>

        <div class='control-row'>
          <label for='timeSig'>Time Signature</label>
          <div class='control'>
            <select id='timeSig' aria-label='Time signature'>
              <option value='4/4'>4 / 4</option>
              <option value='3/4'>3 / 4</option>
              <option value='2/4'>2 / 4</option>
            </select>
            <div class='badge' aria-hidden='true'>Meter</div>
          </div>
        </div>

        <div class='control-row'>
          <label for='keySig'>Key Signature</label>
          <div class='control'>
            <select id='keySig' aria-label='Key signature'>
              <option value='C'>C major / a minor</option>
              <option value='G'>G major / e minor</option>
              <option value='D'>D major / b minor</option>
              <option value='A'>A major / f# minor</option>
              <option value='E'>E major / c# minor</option>
              <option value='F'>F major / d minor</option>
              <option value='Bb'>B♭ major / g minor</option>
              <option value='Eb'>E♭ major / c minor</option>
            </select>
            <div class='badge' aria-hidden='true'>Mode</div>
          </div>
        </div>

        <div class='control-row'>
          <label for='variability'>Variability</label>
          <div class='control'>
            <input id='variability' type='range' min='0' max='100' value='35' aria-label='Variability' />
            <div class='badge' id='varVal'>35</div>
          </div>
        </div>

        <div class='control-row'>
          <label for='complexity'>Complexity</label>
          <div class='control'>
            <input id='complexity' type='range' min='0' max='100' value='48' aria-label='Complexity' />
            <div class='badge' id='compVal'>48</div>
          </div>
        </div>

        <div class='control-row'>
          <label for='density'>Note Density</label>
          <div class='control'>
            <input id='density' type='range' min='0' max='100' value='58' aria-label='Note density' />
            <div class='badge' id='densVal'>58</div>
          </div>
        </div>

        <div class='controls-footer' aria-label='Generator actions'>
          <button id='clear' class='action-btn secondary' type='button'>Clear</button>
          <button id='apply' class='action-btn primary' type='button'>Generate</button>
        </div>

        <div class='current-selection' aria-live='polite'>
          <span>Current</span>
          <span id='currentSelection'>4 / 4 • C • 120 BPM</span>
        </div>
      </div>

      <div class='output-panel'>
        <div class='status-row'>
          <strong>Status</strong>
          <span id='statusMessage'>Awaiting motif.</span>
        </div>

        <div class='summary-grid' aria-live='polite'>
          <div class='summary-cell'>
            <div class='label'>Key</div>
            <strong id='summaryKey'>—</strong>
          </div>
          <div class='summary-cell'>
            <div class='label'>Meter</div>
            <strong id='summaryMeter'>—</strong>
          </div>
          <div class='summary-cell'>
            <div class='label'>Tempo</div>
            <strong id='summaryTempo'>—</strong>
          </div>
          <div class='summary-cell'>
            <div class='label'>Length</div>
            <strong id='summaryLength'>—</strong>
          </div>
        </div>

        <div class='preview-header'>
          <span>Motif preview</span>
          <div class='transport'>
            <button id='playBtn' class='play' type='button'>Play</button>
            <button id='stopBtn' class='stop' type='button'>Stop</button>
          </div>
        </div>

        <div id='outputArea' class='output-area' aria-live='polite' aria-atomic='true'></div>
      </div>
    </section>
  </main>

  <script>
(() => {
  const DEFAULTS = { bpm: 120, timeSignature: "4/4", keySignature: "C", variability: 35, complexity: 48, density: 58 };
  const KEY_SCALE_MAP = {
    C: ["C4","D4","E4","F4","G4","A4","B4"],
    G: ["G3","A3","B3","C4","D4","E4","F#4"],
    D: ["D4","E4","F#4","G4","A4","B4","C#5"],
    A: ["A3","B3","C#4","D4","E4","F#4","G#4"],
    E: ["E3","F#3","G#3","A3","B3","C#4","D#4"],
    F: ["F3","G3","A3","Bb3","C4","D4","E4"],
    Bb: ["Bb3","C4","D4","Eb4","F4","G4","A4"],
    Eb: ["Eb3","F3","G3","Ab3","Bb3","C4","D4"]
  };
  const NOTE_TO_MIDI = { C:0, "C#":1, Db:1, D:2, "D#":3, Eb:3, E:4, F:5, "F#":6, Gb:6, G:7, "G#":8, Ab:8, A:9, "A#":10, Bb:10, B:11 };
  const state = { motif:null, audioCtx:null, activeNodes:[], timer:null };
  const ids = {
    bpmRange: document.getElementById("bpmRange"), bpmNumber: document.getElementById("bpmNumber"),
    timeSig: document.getElementById("timeSig"), keySig: document.getElementById("keySig"),
    variability: document.getElementById("variability"), varVal: document.getElementById("varVal"),
    complexity: document.getElementById("complexity"), compVal: document.getElementById("compVal"),
    density: document.getElementById("density"), densVal: document.getElementById("densVal"),
    apply: document.getElementById("apply"), clear: document.getElementById("clear"),
    play: document.getElementById("playBtn"), stop: document.getElementById("stopBtn"),
    output: document.getElementById("outputArea"), status: document.getElementById("statusMessage"),
    summaryKey: document.getElementById("summaryKey"), summaryMeter: document.getElementById("summaryMeter"),
    summaryTempo: document.getElementById("summaryTempo"), summaryLength: document.getElementById("summaryLength"),
    pattern: document.getElementById("currentSelection")
  };

  function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
  function keyDisplay(key) { return key === "Bb" ? "B♭" : key === "Eb" ? "E♭" : key; }
  function parseNote(name) { const m = /^([A-G])([#b]?)(-?\d)$/.exec(name); if (!m) return 60; const [, letter, acc, octaveText] = m; const oct = Number(octaveText); const sem = NOTE_TO_MIDI[(acc ? letter + acc : letter)] ?? NOTE_TO_MIDI[letter]; return ((oct + 1) * 12) + sem; }
  function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
  function noteLabel(midi) { const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"]; return names[midi % 12] + (Math.floor(midi / 12) - 1); }
  function formatSelection() { return `${ids.timeSig.value} • ${ids.keySig.value} • ${ids.bpmRange.value} BPM`; }
  function updateSelection() { ids.pattern.textContent = formatSelection(); }
  function syncBpm(v) { const safe = clamp(Number.isFinite(v) ? Number(v) : DEFAULTS.bpm, 30, 220); ids.bpmRange.value = String(safe); ids.bpmNumber.value = String(safe); updateSelection(); }
  function refreshBadges() { ids.varVal.textContent = ids.variability.value; ids.compVal.textContent = ids.complexity.value; ids.densVal.textContent = ids.density.value; }

  function makeMotif(cfg) {
    const scale = KEY_SCALE_MAP[cfg.keySignature] || KEY_SCALE_MAP.C;
    const beatsPerBar = parseInt(cfg.timeSignature.split("/")[0], 10) || 4;
    const totalBeats = beatsPerBar * (2 + (cfg.complexity > 75 ? 1 : 0));
    const densityScale = cfg.density / 100;
    const complexityScale = cfg.complexity / 100;
    const subdivision = cfg.density >= 90 ? 0.25 : cfg.density >= 55 ? 0.5 : 1;
    const target = clamp(Math.round(12 + cfg.density * 0.9 + cfg.complexity * 0.35), 12, 96);
    const maxStep = totalBeats / subdivision + 2;
    let beat = 0; let pitchIndex = Math.floor(Math.random() * scale.length); let notes = [];

    while (notes.length < target && beat < totalBeats) {
      const stepChance = clamp(0.22 + densityScale * 0.7 + complexityScale * 0.15, 0.3, 0.96);
      if (Math.random() > stepChance) {
        beat += subdivision;
        continue;
      }

      const start = beat;
      const baseDuration = clamp(0.25 + densityScale * 1.25 + (Math.random() * 0.6) + complexityScale * 0.35, 0.25, 1.75);
      const duration = cfg.density >= 70 ? clamp(baseDuration, 0.25, 1.0) : clamp(baseDuration, 0.5, 2.2);

      let move = 0;
      if (Math.random() < 0.5 + complexityScale * 0.4) move = (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.5 ? 1 : 2);
      if (Math.random() < 0.3 + cfg.variability / 200) move += Math.random() < 0.5 ? -1 : 1;
      pitchIndex = clamp(pitchIndex + move, 0, scale.length - 1);

      const end = Math.min(start + duration, totalBeats);
      notes.push({ start, duration: Math.max(end - start, 0.25), midi: parseNote(scale[pitchIndex]), label: scale[pitchIndex], grace: false, accent: Math.random() < 0.14 + complexityScale * 0.24 });
      if (cfg.complexity > 62 && Math.random() < 0.28 + densityScale * 0.18) {
        const graceIndex = clamp(pitchIndex + (Math.random() < 0.5 ? -1 : 1), 0, scale.length - 1);
        notes.push({ start: start + 0.05, duration: 0.12, midi: parseNote(scale[graceIndex]), label: scale[graceIndex], grace: true, accent: false });
      }

      beat += subdivision;
      if (beat >= totalBeats - subdivision) break;
    }

    if (!notes.length) notes.push({ start: 0, duration: 0.5, midi: parseNote(scale[0]), label: scale[0], grace: false, accent: false });
    notes.sort((a, b) => a.start - b.start);
    const endTime = Math.max(...notes.map(n => n.start + n.duration), totalBeats * 0.9);
    return { key: cfg.keySignature, keyDisplay: keyDisplay(cfg.keySignature), meter: cfg.timeSignature, bpm: cfg.bpm, variability: cfg.variability, complexity: cfg.complexity, density: cfg.density, phraseDuration: endTime, notes, totalBeats };
  }

  function renderEmpty() {
    ids.output.innerHTML = `
      <div class="empty-state" aria-live="polite">
        <div>
          <strong>Awaiting motif</strong>
          <p>Adjust the controls and generate a phrase to preview the rhythm and pitch contour.</p>
        </div>
      </div>`;
  }

  function renderPreview(motif) {
    if (!motif) return renderEmpty();
    const pitchValues = Array.from(new Set(motif.notes.map(n => n.midi))).sort((a, b) => a - b);
    const low = Math.min(...pitchValues, 60);
    const high = Math.max(...pitchValues, 84);
    const span = Math.max(1, high - low);
    const rows = [];
    const lanes = Math.min(7, Math.max(4, Math.ceil(span / 2)));
    for (let i = 0; i < lanes; i++) rows.push(Math.round(low + (span / (lanes - 1 || 1)) * i));
    const labels = document.createElement("div"); labels.className = "pitch-labels"; labels.innerHTML = [...rows].reverse().map(v => `<span>${noteLabel(v)}</span>`).join("");
    const roll = document.createElement("div"); roll.className = "piano-roll";
    motif.notes.forEach((n, index) => {
      const block = document.createElement("div"); block.className = "note-block";
      const left = (n.start / (motif.phraseDuration || 4)) * 100;
      const width = (Math.max(n.duration, 0.28) / (motif.phraseDuration || 4)) * 100;
      const nearest = rows.filter(v => v >= n.midi).sort((a, b) => a - b)[0] ?? rows[rows.length - 1];
      const pos = rows.indexOf(nearest);
      const y = (rows.length - 1 - pos) / Math.max(rows.length - 1, 1);
      block.style.left = `${Math.min(100, left)}%`;
      block.style.width = `${Math.max(9, width)}%`;
      block.style.top = `${Math.max(2, y * 100)}%`;
      block.style.height = `${100 / rows.length - 3}%`;
      block.textContent = index === 0 ? "N" : "";
      if (n.grace) { block.style.opacity = "0.8"; block.style.transform = "scaleY(0.9)"; }
      if (n.accent) block.style.boxShadow = "inset 0 0 0 1px rgba(255,255,255,0.15), 0 0 16px rgba(174,255,99,0.3)";
      roll.appendChild(block);
    });
    const shell = document.createElement("div"); shell.className = "motif-shell"; shell.append(labels, roll); ids.output.innerHTML = ""; ids.output.appendChild(shell);
  }

  function updateSummary(motif) {
    if (!motif) { ids.summaryKey.textContent = "—"; ids.summaryMeter.textContent = "—"; ids.summaryTempo.textContent = "—"; ids.summaryLength.textContent = "—"; return; }
    ids.summaryKey.textContent = motif.keyDisplay; ids.summaryMeter.textContent = motif.meter; ids.summaryTempo.textContent = `${motif.bpm} BPM`; ids.summaryLength.textContent = `${motif.notes.length} notes`;
  }

  function setStatus(msg) { ids.status.textContent = msg; }

  function generateMotif() {
    const cfg = {
      bpm: clamp(Number(ids.bpmRange.value) || DEFAULTS.bpm, 30, 220),
      timeSignature: ids.timeSig.value || DEFAULTS.timeSignature,
      keySignature: ids.keySig.value || DEFAULTS.keySignature,
      variability: clamp(Number(ids.variability.value) || DEFAULTS.variability, 0, 100),
      complexity: clamp(Number(ids.complexity.value) || DEFAULTS.complexity, 0, 100),
      density: clamp(Number(ids.density.value) || DEFAULTS.density, 0, 100)
    };
    const motif = makeMotif(cfg);
    state.motif = motif;
    renderPreview(motif);
    updateSummary(motif);
    setStatus(`Generated in ${keyDisplay(cfg.keySignature)} • ${cfg.timeSignature} • ${cfg.bpm} BPM`);
    updateSelection();
    window.dispatchEvent(new CustomEvent("controlsApplied", { detail: { ...cfg, key: cfg.keySignature, noteCount: motif.notes.length, duration: motif.phraseDuration } }));
    return motif;
  }

  function stopPlayback(skipStatus = false) {
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
    for (const n of state.activeNodes) { try { n.oscillator.stop(); } catch {} try { n.oscillator.disconnect(); } catch {} try { n.gain.disconnect(); } catch {} }
    state.activeNodes = [];
    if (!skipStatus) setStatus("Playback stopped.");
  }

  function ensureAudioContext() {
    if (!state.audioCtx) { const Ctor = window.AudioContext || window.webkitAudioContext; if (Ctor) state.audioCtx = new Ctor(); }
    if (state.audioCtx && state.audioCtx.state === "suspended") state.audioCtx.resume();
    return state.audioCtx;
  }

  function playMotif() {
    if (!state.motif) { setStatus("Generate a motif before playback."); return; }
    const ctx = ensureAudioContext(); if (!ctx) { setStatus("Audio playback is unavailable in this browser."); return; }
    stopPlayback(true);
    const beat = 60 / state.motif.bpm; const start = ctx.currentTime + 0.05;
    state.motif.notes.forEach((note) => {
      const noteStart = start + note.start * beat; const noteEnd = noteStart + Math.max(note.duration, 0.2) * beat;
      const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = note.grace ? "triangle" : "sine"; osc.frequency.value = midiToFreq(note.midi);
      gain.gain.setValueAtTime(0.0001, noteStart); gain.gain.exponentialRampToValueAtTime(0.16, noteStart + 0.03); gain.gain.exponentialRampToValueAtTime(0.0001, noteEnd);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(noteStart); osc.stop(noteEnd + 0.04); state.activeNodes.push({ oscillator: osc, gain });
    });
    state.timer = window.setTimeout(() => stopPlayback(false), (state.motif.phraseDuration * beat + 0.25) * 1000);
    setStatus(`Playing ${state.motif.keyDisplay} motif at ${state.motif.bpm} BPM.`);
  }

  function clearAll() {
    ids.bpmRange.value = String(DEFAULTS.bpm); ids.bpmNumber.value = String(DEFAULTS.bpm); ids.timeSig.value = DEFAULTS.timeSignature; ids.keySig.value = DEFAULTS.keySignature; ids.variability.value = String(DEFAULTS.variability); ids.complexity.value = String(DEFAULTS.complexity); ids.density.value = String(DEFAULTS.density); refreshBadges(); updateSelection(); state.motif = null; stopPlayback(true); renderEmpty(); updateSummary(null); setStatus("Cleared. Ready to generate."); window.dispatchEvent(new CustomEvent("controlsCleared"));
  }

  function attachEvents() {
    ids.bpmRange.addEventListener("input", () => syncBpm(Number(ids.bpmRange.value)));
    ids.bpmNumber.addEventListener("input", () => { const v = Number(ids.bpmNumber.value); if (!Number.isFinite(v)) return; syncBpm(v); });
    ids.timeSig.addEventListener("change", updateSelection);
    ids.keySig.addEventListener("change", updateSelection);
    [ids.variability, ids.complexity, ids.density].forEach(el => el.addEventListener("input", refreshBadges));
    ids.apply.addEventListener("click", generateMotif);
    ids.clear.addEventListener("click", clearAll);
    ids.play.addEventListener("click", playMotif);
    ids.stop.addEventListener("click", () => stopPlayback(false));
  }

  window.AllameinFrontend = {
    setOutputElement(node) { ids.output.innerHTML = ""; ids.output.appendChild(node); },
    clearOutput() { renderEmpty(); updateSummary(null); },
    generateMotif,
    getLatestMotif() { return state.motif ? JSON.parse(JSON.stringify(state.motif)) : null; },
    playMotif,
    stopMotif() { stopPlayback(false); }
  };

  refreshBadges(); updateSelection(); renderEmpty(); updateSummary(null); attachEvents();
})();
</script>
</body>
</html>
